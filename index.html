<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cook With What You Have</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>🍳 Cook With What You Have</h1>
    <p class="subtitle">
      Enter ingredients you already have and get quick, healthy recipes.
    </p>

    <!-- Input Section -->
    <div class="input-section">
      <input 
        type="text" 
        id="ingredientsInput" 
        placeholder="Example: egg, rice, onion"
      >
      <button onclick="findRecipes()">Find Recipes</button>
    </div>

    <!-- Recipe Results -->
    <div id="recipeList" class="recipes"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
