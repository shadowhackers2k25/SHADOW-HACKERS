<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cook With What You Have</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>🍳 Cook With What You Have</h1>
    <p class="subtitle">
      Enter ingredients you already have and get quick, healthy recipes.
    </p>

    <!-- Input Section -->
    <div class="input-section">
      <input 
        type="text" 
        id="ingredientsInput" 
        list="ingredientsList"
        placeholder="Type or select: egg, rice, onion"
      />

        <datalist id="ingredientsList"></option>
        <option value="egg, rice, onion"></option>
        <option value="egg, onion"></option>
        <option value="rice, onion"></option>
        <option value="egg"></option>
        <option value="Flour, Sugar, Cocoa powder, Milk"></option>
        <option value="Bread, Egg"></option>
        <option value="Maggi"></option>
        <option value="Bread, Peanut Butter"></option>
        <option value="Maggi"></option>
        <option value="Banana, Milk, Sugar"></option>
        <option value="Bread, Egg, Milk, Sugar"></option>
        <option value="Poha"></option>
        <option value="Poha, Onion"></option>
        <option value="Any fruits, Chat masala"></option>
        <option value="Cooked rice, Ghee"></option>
        <option value="Bread, Onion, Tomato, Salt, Butter"></option>
        <option value="Potato, Salt, Oil"></option>
        <option value="Milk, Tea leaves, Sugar"></option>
        

        </datalist>

      <button onclick="findRecipes()">Find Recipes here</button>
    </div>

    <!-- Recipe Results -->
    <div id="recipeList" class="recipes"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
