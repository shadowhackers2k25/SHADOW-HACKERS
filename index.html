<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cook With What You Have</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>🍳 Cook With What You Have</h1>
    <p class="subtitle">
      Enter ingredients you already have and get quick, healthy recipes.
    </p>

    <!-- Format Instruction -->
    <p class="instruction">📝 Format: lowercase ingredients, separated by comma & space (e.g., egg, rice, onion)</p>

    <!-- Input Section -->
    <div class="input-section">
      <input 
        type="text" 
        id="ingredientsInput" 
        list="ingredientsList"
        placeholder="Type or select: egg, rice, onion"
      />

        <datalist id="ingredientsList">
        <option value="egg, rice, onion"></option>
        <option value="egg, onion"></option>
        <option value="rice, onion"></option>
        <option value="egg"></option>
        <option value="flour, sugar, cocoa powder, milk"></option>
        <option value="bread, egg"></option>
        <option value="maggi"></option>
        <option value="bread, peanut butter"></option>
        <option value="banana, milk, sugar"></option>
        <option value="bread, egg, milk, sugar"></option>
        <option value="poha, onion"></option>
        <option value="any fruits, chat masala"></option>
        <option value="cooked rice, ghee"></option>
        <option value="bread, onion, tomato, salt, butter"></option>
        <option value="potato, salt, oil"></option>
        <option value="milk, tea leaves, sugar"></option>
        <option value="milk, coffee powder, sugar"></option>
        <option value="bread, cheese, butter"></option>
        <option value="egg, onion, salt, oil"></option>
        <option value="boiled corn, salt, butter"></option>
        <option value="chicken, onion, tomato, garlic, ginger, spices"></option>
        <option value="chicken, chili powder, turmeric, garlic, oil"></option>
        <option value="mutton, onion, ginger, garlic, whole spices"></option>
        <option value="chicken, curd, ginger garlic paste, spices"></option>
        <option value="chicken, egg, onion, green chili, spices"></option>
        </datalist>

      <button onclick="findRecipes()">Find Recipes</button>
    </div>

    <!-- Recipe Results -->
    <div id="recipeList" class="recipes"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
