<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cook With What You Have</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>🍳 Cook With What You Have</h1>
    <p class="subtitle">
      Enter ingredients you already have and get quick, healthy recipes.
    </p>

    <!-- Input Section -->
    <div class="input-section">
      <input 
        type="text" 
        id="ingredientsInput" 
        list="ingredientsList"
        placeholder="Type or select: egg, rice, onion"
      />

        <datalist id="ingredientsList">
        <option value="egg">
        <option value="rice">
        <option value="onion">
        <option value="milk">
        <option value="flour">
        <option value="Sugar">
        <option value="Cocoa powder">
        <option value="Bread"></option>
        <option value="Maggi">
        <option value="Peanut Butter">
        <option value="Banana"></option>
        <option value="Poha"></option>
        <option value="Any fruits"></option>
        <option value="Chat masala"></option>
        <option value="Ghee"></option>
        <option value="Cooked rice"></option>
        <option value="Coffee powder"></option>
        </datalist>

      <button onclick="findRecipes()">Find Recipes here</button>
    </div>

    <!-- Recipe Results -->
    <div id="recipeList" class="recipes"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
